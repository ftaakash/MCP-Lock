[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcplock"
version = "0.0.1"
description = "Provenance-aware pre-install verification for coding agents (MCP-Lock)"
requires-python = ">=3.11,<3.12"
dependencies = ["requests>=2.31", "numpy>=1.26", "packaging>=23", "tree-sitter>=0.23",
                "tree-sitter-javascript>=0.23", "tree-sitter-typescript>=0.23"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
mcplock = "gate.cli:main"

[tool.setuptools]
packages = ["census", "lockfile", "gate"]

[tool.setuptools.package-data]
gate = ["data/*.json"]
lockfile = ["*.json"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"census/dynamic.py" = ["E501"]  # embedded JS/Python entry scripts
"eval/scoring/s1_popular_set_calibration.py" = ["E", "B", "UP", "I"]  # kept exactly as run in phase 0
