[project]
name = "mcplock"
version = "0.0.1"
description = "Provenance-aware pre-install verification for coding agents (MCP-Lock)"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
mcplock = "gate.cli:main"

[tool.setuptools]
packages = ["census", "lockfile", "gate"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
