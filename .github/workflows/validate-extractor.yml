name: Validate static extractor

# Plan §6: dynamic tools/list ground truth for the static tool-definition extractor (harness v2).
# Stage A installs with network on, install scripts disabled, dependencies as of release date;
# stage B runs the server in Docker with --network none, read-only root, no capabilities,
# non-root, and never calls a tool.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Validated versions per ecosystem"
        default: "40"
        required: true
      max_attempts:
        description: "Maximum attempts per ecosystem"
        default: "160"
        required: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        eco: [npm, pypi]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.lock

      - name: Pull base images
        run: |
          for img in node:22-slim python:3.11-slim python:3.12-slim python:3.13-slim; do
            docker pull -q "$img"
          done

      - name: Run validation (${{ matrix.eco }})
        run: >
          python -m census.dynamic run results/census/pilot --eco ${{ matrix.eco }}
          --target ${{ inputs.target }} --max-attempts ${{ inputs.max_attempts }} --workers 3

      - uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.eco }}
          path: |
            results/census/pilot/validation_${{ matrix.eco }}.jsonl
            results/census/pilot/validation_${{ matrix.eco }}.jsonl.provenance.json
          retention-days: 30

  summarize:
    needs: validate
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.lock

      - uses: actions/download-artifact@v4
        with:
          pattern: validation-*
          path: results/census/pilot
          merge-multiple: true

      - name: Summarize
        run: python -m census.dynamic summarize results/census/pilot

      - uses: actions/upload-artifact@v4
        with:
          name: extractor-validation-v2
          path: |
            results/census/pilot/validation_npm.jsonl*
            results/census/pilot/validation_pypi.jsonl*
            results/census/pilot/validation_summary.json*
          retention-days: 30
