name: Validate static extractor

# Plan §6: dynamic tools/list ground truth for the static tool-definition extractor (harness v2).
# Stage A installs with network on, install scripts disabled, dependencies as of release date;
# stage B runs the server in Docker with --network none, read-only root, no capabilities,
# non-root, and never calls a tool.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Validated versions per ecosystem"
        default: "40"
        required: true
      max_attempts:
        description: "Maximum attempts per ecosystem"
        default: "160"
        required: true
      pool:
        description: "dev (pilot packages, harness development) or heldout (phase-2 sample, frozen extractor)"
        default: "heldout"
        required: true
        type: choice
        options: [dev, heldout]

env:
  OUT_DIR: ${{ inputs.pool == 'heldout' && 'results/census/phase2' || 'results/census/pilot' }}
  PREFIX: ${{ inputs.pool == 'heldout' && 'validation_heldout_' || 'validation_' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        eco: [npm, pypi]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.lock

      - name: Pull base images
        run: |
          for img in node:22-slim python:3.11-slim python:3.12-slim python:3.13-slim; do
            docker pull -q "$img"
          done

      - name: Run validation (${{ matrix.eco }})
        run: >
          python -m census.dynamic run results/census/pilot --eco ${{ matrix.eco }}
          --target ${{ inputs.target }} --max-attempts ${{ inputs.max_attempts }} --workers 3
          --pool ${{ inputs.pool }} --sample-dir results/census/phase2

      - uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.eco }}
          path: |
            ${{ env.OUT_DIR }}/${{ env.PREFIX }}${{ matrix.eco }}.jsonl
            ${{ env.OUT_DIR }}/${{ env.PREFIX }}${{ matrix.eco }}.jsonl.provenance.json
          retention-days: 30

  summarize:
    needs: validate
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.lock

      - uses: actions/download-artifact@v4
        with:
          pattern: validation-*
          path: ${{ env.OUT_DIR }}
          merge-multiple: true

      - name: Summarize
        run: python -m census.dynamic summarize ${{ env.OUT_DIR }} --prefix ${{ env.PREFIX }}

      - uses: actions/upload-artifact@v4
        with:
          name: extractor-validation-${{ inputs.pool }}
          path: ${{ env.OUT_DIR }}/${{ env.PREFIX }}*
          retention-days: 30
