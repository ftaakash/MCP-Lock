# Local-only registry for synthetic rug pulls (PREREG §3.3). No uplinks: nothing proxies to npmjs.
storage: /verdaccio/storage/data
auth:
  htpasswd:
    file: /verdaccio/storage/htpasswd
    max_users: 10
uplinks: {}
packages:
  '@mcplock-eval/*':
    access: $all
    publish: $authenticated
    unpublish: $authenticated
  '**':
    access: $all
    publish: $authenticated
max_body_size: 60mb
listen: 0.0.0.0:4873
log: { type: stdout, format: pretty, level: warn }
